<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrus — Internal Developer Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b0f;
      --bg2: #0d1117;
      --bg3: #131920;
      --border: #1c2535;
      --border2: #263040;
      --green: #00e676;
      --green-dim: #00b85c;
      --amber: #ffab40;
      --blue: #5ab4ff;
      --red: #ff5f57;
      --text: #b8c4d0;
      --text-dim: #5a6878;
      --text-bright: #e2eaf4;
      --mono: 'JetBrains Mono', monospace;
      --body: 'Outfit', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.7; }
    a { color: var(--green); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 56px;
      background: rgba(8,11,15,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .nav-logo { font-family: var(--mono); font-size: 13px; color: var(--text-bright); }
    .nav-logo span { color: var(--green); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 0.06em; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--green); text-decoration: none; }

    .page { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }
    .page-label { font-family: var(--mono); font-size: 11px; color: var(--green); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .page-title { font-size: 28px; font-weight: 600; color: var(--text-bright); margin-bottom: 2rem; }

    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border2); }

    .badge {
      display: inline-block; font-family: var(--mono); font-size: 10px;
      padding: 2px 8px; border-radius: 3px; letter-spacing: 0.05em;
    }
    .badge-green { background: rgba(0,230,118,0.1); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
    .badge-amber { background: rgba(255,171,64,0.1); color: var(--amber); border: 1px solid rgba(255,171,64,0.2); }
    .badge-blue  { background: rgba(90,180,255,0.1); color: var(--blue);  border: 1px solid rgba(90,180,255,0.2); }
    .badge-red   { background: rgba(255,95,87,0.1);  color: var(--red);   border: 1px solid rgba(255,95,87,0.2); }
    .badge-dim   { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border); }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 10px 20px; border-radius: 4px; border: none;
      font-family: var(--mono); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .btn-primary { background: var(--green); color: var(--bg); }
    .btn-primary:hover { background: var(--green-dim); text-decoration: none; }
    .btn-ghost { background: transparent; color: var(--text-bright); border: 1px solid var(--border2); }
    .btn-ghost:hover { border-color: var(--green); color: var(--green); text-decoration: none; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
    .stat-val { font-family: var(--mono); font-size: 32px; font-weight: 700; color: var(--green); }
    .stat-label { font-size: 13px; color: var(--text-dim); margin-top: 0.3rem; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { font-family: var(--mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; padding: 0.6rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:hover td { background: var(--bg3); }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.2rem; }
    .form-label { font-family: var(--mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; }
    .form-input, .form-select {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: 10px 14px;
      color: var(--text-bright); font-family: var(--body); font-size: 14px;
      transition: border-color 0.2s; outline: none; width: 100%;
    }
    .form-input:focus, .form-select:focus { border-color: var(--green); }
    .form-select option { background: var(--bg2); }

    .terminal-block {
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 6px; overflow: hidden; margin: 1rem 0;
    }
    .terminal-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: var(--red); }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: var(--green); }
    .terminal-title { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-left: 6px; }
    .terminal-body { padding: 1rem 1.2rem; font-family: var(--mono); font-size: 12px; line-height: 1.8; }
    .ps { color: var(--green); }
    .cmd { color: var(--text-bright); }
    .out { color: var(--text-dim); }
    .out-green { color: var(--green); }
    .out-red { color: var(--red); }

    .footer { padding: 2rem; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; color: var(--text-dim); text-align: center; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><span>~/</span>petrus-idp<span>_</span></div>
    <ul class="nav-links">
      <li><a href="/" class="{{ 'active' if request.path == '/' }}">home</a></li>
      <li><a href="/environments" class="{{ 'active' if request.path == '/environments' }}">environments</a></li>
      <li><a href="/provision" class="{{ 'active' if request.path == '/provision' }}">provision</a></li>
      <li><a href="/catalog" class="{{ 'active' if request.path == '/catalog' }}">catalog</a></li>
      <li><a href="http://35.174.220.243:31088" target="_blank">argocd</a></li>
      <li><a href="http://35.174.220.243:31300" target="_blank">grafana</a></li>
    </ul>
  </nav>
  {% block content %}{% endblock %}
  <footer class="footer">
    Petrus IDP v0.1.0 &nbsp;·&nbsp; Built by Mary Okpala &nbsp;·&nbsp;
    <a href="https://github.com/MaryOkpala/petrus" target="_blank">github.com/MaryOkpala/petrus</a>
  </footer>
</body>
</html>
