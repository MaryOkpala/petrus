apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: TEAM-ENVIRONMENT
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    petrus.io/team: TEAM
    petrus.io/environment: ENVIRONMENT
    petrus.io/managed-by: petrus
spec:
  project: default
  source:
    repoURL: https://github.com/MaryOkpala/petrus.git
    targetRevision: HEAD
    path: environments/TEAM/ENVIRONMENT
  destination:
    server: https://kubernetes.default.svc
    namespace: TEAM-ENVIRONMENT
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
